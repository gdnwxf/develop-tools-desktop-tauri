[package]
name = "devops-tools-tauri"
version = "0.1.3"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12.5", features = ["unstable", "devtools"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
hmac = "0.12"
sha1 = "0.10"
open = "5"
time = "0.3"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com"] }
